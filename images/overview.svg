<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><style>
.h1{font:bold 26px Segoe UI,Arial,sans-serif;fill:#111}
.bt{font:bold 18px Segoe UI,Arial,sans-serif;fill:#111}
.bs{font:14px Segoe UI,Arial,sans-serif;fill:#555}
.wl{font:bold 14px Segoe UI,Arial,sans-serif}
.pin{font:bold 13px Consolas,monospace;fill:#2a7a3a}
</style><rect width="1400" height="800" fill="#fff"/><text x="40" y="40" class="h1">GT Trackball - how it all connects</text>
<text x="40" y="64" class="bs">Overview only. Exact pins and wire colours: wiring.svg.</text>
<rect x="40" y="100" width="230" height="80" rx="10" fill="#eef3ff" stroke="#445" stroke-width="2"/>
<text x="155.0" y="132.0" class="bt" text-anchor="middle">PC / Mac</text>
<text x="155.0" y="156.0" class="bs" text-anchor="middle">USB-A cable, or Bluetooth</text>
<rect x="40" y="250" width="230" height="80" rx="10" fill="#f4f6f8" stroke="#445" stroke-width="2"/>
<text x="155.0" y="282.0" class="bt" text-anchor="middle">USB-A port</text>
<text x="155.0" y="306.0" class="bs" text-anchor="middle">rear wall feedthrough</text>
<rect x="40" y="470" width="230" height="90" rx="10" fill="#fdecea" stroke="#445" stroke-width="2"/>
<text x="155.0" y="507.0" class="bt" text-anchor="middle">Charger + 5 V boost</text>
<text x="155.0" y="531.0" class="bs" text-anchor="middle">charges the LiPo,</text>
<text x="155.0" y="548.0" class="bs" text-anchor="middle">makes the 5 V rail</text>
<rect x="40" y="660" width="230" height="80" rx="10" fill="#e8f6ec" stroke="#445" stroke-width="2"/>
<text x="155.0" y="692.0" class="bt" text-anchor="middle">LiPo 3.7 V</text>
<text x="155.0" y="716.0" class="bs" text-anchor="middle">52 x 35 x 10 mm</text>
<rect x="330" y="660" width="230" height="80" rx="10" fill="#f4f6f8" stroke="#445" stroke-width="2"/>
<text x="445.0" y="692.0" class="bt" text-anchor="middle">Voltage sensor</text>
<text x="445.0" y="716.0" class="bs" text-anchor="middle">battery level (÷5)</text>
<rect x="560" y="230" width="280" height="260" rx="10" fill="#e3f1e3" stroke="#2a7a3a" stroke-width="2"/>
<text x="700.0" y="366.0" class="bt" text-anchor="middle">Raspberry Pi Pico 2 W</text>
<rect x="1110" y="100" width="250" height="80" rx="10" fill="#f3ecfa" stroke="#445" stroke-width="2"/>
<text x="1235.0" y="132.0" class="bt" text-anchor="middle">2.13" e-paper</text>
<text x="1235.0" y="156.0" class="bs" text-anchor="middle">status + swing meter</text>
<rect x="1110" y="250" width="250" height="80" rx="10" fill="#e8f6ec" stroke="#445" stroke-width="2"/>
<text x="1235.0" y="282.0" class="bt" text-anchor="middle">3 lit buttons</text>
<text x="1235.0" y="306.0" class="bs" text-anchor="middle">LEFT / MENU / RIGHT</text>
<rect x="1110" y="420" width="250" height="110" rx="10" fill="#f4f6f8" stroke="#445" stroke-width="2"/>
<text x="1235.0" y="467.0" class="bt" text-anchor="middle">3" trackball</text>
<text x="1235.0" y="491.0" class="bs" text-anchor="middle">its own PS/2 board (J1)</text>
<text x="1235.0" y="508.0" class="bs" text-anchor="middle">+ ball light</text>
<rect x="900" y="640" width="230" height="80" rx="10" fill="#fff3e0" stroke="#445" stroke-width="2"/>
<text x="1015.0" y="672.0" class="bt" text-anchor="middle">MOSFET module</text>
<text x="1015.0" y="696.0" class="bs" text-anchor="middle">cuts trackball power</text>
<text x="1015.0" y="713.0" class="bs" text-anchor="middle">in sleep</text>
<text x="572" y="290" class="pin">USB</text>
<text x="572" y="350" class="pin">VBUS</text>
<text x="572" y="430" class="pin">VSYS</text>
<text x="828" y="275" class="pin" text-anchor="end">SPI  GP8-13</text>
<text x="828" y="305" class="pin" text-anchor="end">GP4-7</text>
<text x="828" y="445" class="pin" text-anchor="end">GP2 / GP3</text>
<text x="640" y="482" class="pin" text-anchor="middle">GP26</text>
<text x="790" y="482" class="pin" text-anchor="middle">GP22</text>
<polyline points="155,180 155,250" fill="none" stroke="#7a3fb0" stroke-width="4" stroke-linejoin="round"/>
