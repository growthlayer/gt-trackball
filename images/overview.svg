<polyline points="560,345 330,345 330,500 270,500" fill="none" stroke="#d0312d" stroke-width="4" stroke-linejoin="round"/>
<text x="335" y="335" class="wl" text-anchor="start" style="fill:#d0312d">VBUS -&gt; charge input</text>
<polyline points="155,560 155,660" fill="none" stroke="#d0312d" stroke-width="4" stroke-linejoin="round"/>
<text x="165" y="615" class="wl" text-anchor="start" style="fill:#d0312d">B+ / B-</text>
<polyline points="270,530 480,530 480,425 560,425" fill="none" stroke="#d0312d" stroke-width="4" stroke-linejoin="round"/>
<text x="490" y="520" class="wl" text-anchor="start" style="fill:#d0312d">5 V</text>
<polyline points="480,530 480,610 1015,610 1015,640" fill="none" stroke="#d0312d" stroke-width="4" stroke-linejoin="round"/>
<text x="700" y="600" class="wl" text-anchor="middle" style="fill:#d0312d">5 V</text>
<polyline points="270,700 330,700" fill="none" stroke="#d0312d" stroke-width="4" stroke-linejoin="round"/>
<polyline points="560,700 640,700 640,490" fill="none" stroke="#a0612a" stroke-width="4" stroke-linejoin="round"/>
<polyline points="790,490 790,680 900,680" fill="none" stroke="#a0612a" stroke-width="4" stroke-linejoin="round"/>
<text x="845" y="670" class="wl" text-anchor="middle" style="fill:#a0612a">on / off</text>
<polyline points="1130,680 1235,680 1235,530" fill="none" stroke="#d0312d" stroke-width="4" stroke-linejoin="round"/>
<text x="1245" y="610" class="wl" text-anchor="start" style="fill:#d0312d">switched power</text>
<polyline points="840,440 1110,440" fill="none" stroke="#1f6fd1" stroke-width="4" stroke-linejoin="round"/>
<text x="975" y="430" class="wl" text-anchor="middle" style="fill:#1f6fd1">PS/2 DATA + CLOCK</text>
<polyline points="840,300 980,300 980,290 1110,290" fill="none" stroke="#1e9e54" stroke-width="4" stroke-linejoin="round"/>
<text x="975" y="280" class="wl" text-anchor="middle" style="fill:#1e9e54">switches + LED common</text>
<polyline points="840,270 950,270 950,140 1110,140" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linejoin="round"/>
<text x="1030" y="130" class="wl" text-anchor="middle" style="fill:#8e44ad">SPI + power</text>
<polyline points="620,230 620,140 270,140" fill="none" stroke="#7a3fb0" stroke-width="4" stroke-linejoin="round" stroke-dasharray="9 6"/>
<text x="450" y="130" class="wl" text-anchor="middle" style="fill:#7a3fb0">Bluetooth LE</text></svg>